version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # Don't adopt a release the moment it lands; a compromised version is most
    # dangerous in its first hours, before anyone has looked at it.
    cooldown:
      default-days: 7
    # codeql-action's init/analyze are separate Dependabot dependencies but are
    # version-locked at runtime, so they have to move in a single PR.
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Major TypeScript bumps break the toolchain before any of our code:
      # tsup's bundled rollup-plugin-dts crashes against TS7's changed
      # internals (2026-07-13 estate incident, same failure as the frontends).
      # Revisit once tsup ships a TS7-compatible rollup-plugin-dts.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node must track the Node FLOOR (20), not the newest runtime.
      # On @types/node 26 the compiler would accept APIs absent from Node 20
      # and the Node20_1 fallback handler would fail only at runtime, on an
      # agent — the CI matrix catches that only if a test exercises the API.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # npm (.github/commit-message-check: the parser the PR gate shares with
  # release-please)
  # ---------------------------------------------------------------------------
  # The gate is only meaningful while it parses the way release-please does, so
  # these bumps want checking against release-please's own dependency rather
  # than merging on green.
  - package-ecosystem: npm
    directory: /.github/commit-message-check
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      commit-message-check:
        patterns:
          - "*"
