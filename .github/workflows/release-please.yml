---
# Delegates to the shared definition in 4cloudguru/shared-workflows.
#
# This file used to be a local copy. THIRTEEN repos across two owners carry a
# release-please workflow, in seven distinct versions -- all with the same
# config-file, manifest-file, App id variable and App key secret. With this
# batch, nine of the thirteen call the shared definition; the four still
# holding local copies are azure-pipelines-{terraform,packer,release-docs} and
# hcp-terraform-pwsh.
#
# NOTE THE DIRECTION OF THIS PARTICULAR CONVERSION. Most of the twelve were
# converted because the shared definition was stricter than they were. This
# repo was the opposite: its local copy ran harden-runner, a job timeout, a
# non-cancelling concurrency group and a credential preflight that the shared
# definition did NOT have, and that the five sethbacon repos had never had.
#
# Converting it as-is would have SILENTLY REGRESSED it -- a consolidation
# quietly removing controls the repo already ran. So those controls were folded
# INTO the shared workflow first (see shared-workflows PRs #3 and #4), and all
# nine callers now get them. Nothing is lost here; eight other repos gained.
#
# PINNED BY SHA, not by a tag or @main. A shared workflow is itself something
# that drifts, and repos on different pins is HARDER to see than divergent
# files -- every repo looks like it is using "the shared one".
#
# The trailing `# v1.0.0` NAMES the release that SHA is; it does not select it.
# Do not "simplify" the ref to @v1.0.0 -- a tag is mutable, so the reviewed
# workflow and the executed workflow would stop being the same thing. The label
# exists because an unlabelled 40-hex SHA cannot be reviewed or updated
# deliberately, which azure-pipelines-release-docs' workflow-hardening guard
# rejects outright and the other twelve repos accepted without noticing.
#
# `vars` resolves against THIS repository, so RELEASE_DISPATCH_APP_ID is
# unchanged and nothing about the App installation moves.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-please:
    uses: 4cloudguru/shared-workflows/.github/workflows/release-please.yml@3aae0966a70daa50bcfe741ef07e20e86c814af4 # v1.20.2
    # Exactly one secret, named. NOT `secrets: inherit` -- that forwards EVERY
    # secret in this repository to the called workflow, which zizmor flags
    # (secrets-inherit) and which would be an over-grant introduced by a change
    # whose whole point is least privilege.
    secrets:
      RELEASE_DISPATCH_APP_KEY: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
